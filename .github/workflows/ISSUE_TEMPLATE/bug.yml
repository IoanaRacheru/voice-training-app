name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: Optional - how can we reach you for more info?
      placeholder: email@example.com
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen
      placeholder: Explain the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / errors
      description: Paste any console errors or logs
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have checked existing issues and this is not a duplicate
          required: true
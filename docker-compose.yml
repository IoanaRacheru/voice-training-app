services:
  vosk:
    image: alphacep/kaldi-en:latest
    ports:
      - "2700:2700"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak-themes:/opt/keycloak/themes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SERVER_PORT: ${SERVER_PORT:-3000}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8080/realms/voice-training}
      KEYCLOAK_EXPECTED_AUDIENCES: ${KEYCLOAK_EXPECTED_AUDIENCES:-account}
      ANALYZE_MAX_BODY_BYTES: ${ANALYZE_MAX_BODY_BYTES:-1048576}
      RUST_LOG: debug
      ASR_PROVIDER: vosk_remote
      VAD_PROVIDER: energy
      PROVIDER_STRICT: "true"
      VOSK_SERVER_URL: ws://vosk:2700
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_started
      vosk:
        condition: service_started
    restart: unless-stopped

  api_vosk:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        API_FEATURES: "--features asr_vosk"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SERVER_PORT: 3000
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8080/realms/voice-training}
      KEYCLOAK_EXPECTED_AUDIENCES: ${KEYCLOAK_EXPECTED_AUDIENCES:-account}
      ANALYZE_MAX_BODY_BYTES: ${ANALYZE_MAX_BODY_BYTES:-1048576}
      RUST_LOG: debug
      ASR_PROVIDER: vosk_remote
      VAD_PROVIDER: energy
      PROVIDER_STRICT: "true"
      VOSK_SERVER_URL: ws://vosk:2700
    ports:
      - "3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_started
      vosk:
        condition: service_started
    restart: unless-stopped

  api_vosk_silero:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        API_FEATURES: "--features asr_vosk,vad_silero"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SERVER_PORT: 3000
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:-http://localhost:8080/realms/voice-training}
      KEYCLOAK_EXPECTED_AUDIENCES: ${KEYCLOAK_EXPECTED_AUDIENCES:-account}
      ANALYZE_MAX_BODY_BYTES: ${ANALYZE_MAX_BODY_BYTES:-1048576}
      RUST_LOG: debug
      ASR_PROVIDER: vosk_remote
      VAD_PROVIDER: silero
      PROVIDER_STRICT: "true"
      VOSK_SERVER_URL: ws://vosk:2700
    ports:
      - "3002:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_started
      vosk:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data:
  postgres_data:

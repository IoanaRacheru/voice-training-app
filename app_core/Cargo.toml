[package]
name = "app_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
utoipa = "4"
rustfft = "6"
tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }

[features]
default = []
asr_vosk = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
